name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test (unit + CDK assertions)
        run: npm test

      - name: Require VITE_API_URL
        run: test -n "${{ vars.VITE_API_URL }}" || { echo "VITE_API_URL repo variable is not set"; exit 1; }

      - name: Build and test web client
        working-directory: web
        run: |
          npm ci
          npm run test
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::442109628755:role/order-flow-github-deploy
          aws-region: ap-southeast-1

      - name: Deploy
        run: npx cdk deploy --require-approval never

      - name: E2E (against the deployed stack)
        run: bash e2e/e2e.sh
